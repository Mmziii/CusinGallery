# Internal-only nginx serving the built React SPA. Not exposed directly to
# the internet -- the top-level nginx/ service proxies to this container.
# See nginx/conf.d/cusin.conf for the public-facing configuration.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA fallback: any path not matching a real file resolves to
    # index.html so React Router handles client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
