# Internal-only nginx serving the built React SPA. Not exposed directly to
# the internet -- the top-level nginx/ service proxies to this container.
# See nginx/conf.d/cusin.conf for the public-facing configuration.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA fallback: any path not matching a real file resolves to
    # index.html so React Router handles client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Part R4 item 5: self-hosted font files are versioned by name;
    # cache them aggressively so Vazirmatn never re-downloads.
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Brand mark/logos under /brand/ change rarely but are referenced
    # everywhere (placeholder mask, header logo) -- a day is plenty.
    location /brand/ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # The SPA shell itself must ALWAYS revalidate, otherwise customers
    # keep an old index.html pointing at assets a later deploy deleted.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
