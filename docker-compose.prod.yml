# PRODUCTION Docker Compose stack for Cusin Gallery (Phase E).
#
# Differences from the development docker-compose.yml:
#   * nginx terminates TLS on 443 (Let's Encrypt via the certbot
#     companion) and redirects all HTTP traffic to HTTPS;
#   * backend applies migrations + collectstatic automatically on every
#     deploy (docker/backend/entrypoint.sh -- single-replica assumption,
#     see that file) and boots with config.settings.production;
#   * a `scheduler` service runs `expire_unpaid_orders` hourly (the
#     abandoned-checkout cleanup; a plain loop in the backend image --
#     no extra dependencies, logs land in `docker compose logs scheduler`);
#   * db and redis publish NO host ports -- they are reachable only on
#     the internal compose network;
#   * media/static live on named volumes shared with nginx.
#
# FIRST-TIME DEPLOY: certificates don't exist yet, so nginx cannot start
# with the TLS config. Follow docs/DEPLOY.md (section «فعال‌سازی SSL»):
# bootstrap HTTP with nginx/prod.d/00-bootstrap-http.conf.example, issue
# the certificate with certbot, then switch to the real config.
#
# Usage:
#   cp .env.example .env   (fill EVERY value; run
#                           `docker compose -f docker-compose.prod.yml exec
#                            backend python manage.py check_production`
#                           after the first start)
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml exec backend \
#       python manage.py createsuperuser

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Deliberately NO `ports:` -- PostgreSQL must never be reachable from
    # outside the compose network.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Deliberately NO `ports:` -- same rule as the database.

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      DJANGO_SETTINGS_MODULE: config.settings.production
    command: ["sh", "/app/docker-entrypoint.sh"]
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./docker/backend/entrypoint.sh:/app/docker-entrypoint.sh:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Hourly abandoned-order cleanup (apps/orders expire_unpaid_orders).
  # Same image and env as the backend; the command is a plain loop so no
  # cron daemon or extra image is needed. The command itself is
  # cron-safe: idempotent, row-lock-checked, never moves stock (see
  # docs/PAYMENTS.md §6).
  scheduler:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      DJANGO_SETTINGS_MODULE: config.settings.production
    command:
      - sh
      - -c
      - |
        while true; do
          echo "[scheduler] $$(date -u +%FT%TZ) running expire_unpaid_orders"
          python manage.py expire_unpaid_orders || echo "[scheduler] run failed (will retry next hour)"
          # Part R5 item 11: opt-in cart-reminder SMS. No-op unless the
          # owner set CART_REMINDER_ENABLED=True; quiet hours and all
          # eligibility rules live inside the command itself.
          python manage.py send_cart_reminders || echo "[scheduler] cart reminders failed (will retry next hour)"
          today=$$(date -u +%F)
          if [ "$$today" != "$$(cat /tmp/fbt_last 2>/dev/null)" ]; then
            echo "[scheduler] $$(date -u +%FT%TZ) running rebuild_frequently_bought_together (daily)"
            python manage.py rebuild_frequently_bought_together || echo "[scheduler] fbt rebuild failed (will retry tomorrow)"
            echo "$$today" > /tmp/fbt_last
          fi
          sleep 3600
        done
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_SITE_ORIGIN: ${VITE_SITE_ORIGIN:-https://cusin.ir}
        # Optional analytics (Part 4): empty = nothing loads. See
        # docs/DEPLOY.md «آنالیتیکس».
        VITE_ANALYTICS_SCRIPT_URL: ${ANALYTICS_SCRIPT_URL:-}
        VITE_ANALYTICS_SITE_ID: ${ANALYTICS_SITE_ID:-}
        # Optional frontend error reporting (Part S3 item 9): empty =
        # the browser sends nothing; any non-empty value enables crash
        # reports through the backend's existing Sentry setup.
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/prod.d:/etc/nginx/conf.d:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - backend
      - frontend

  # Let's Encrypt companion: renews certificates twice a day via the
  # webroot nginx serves at /.well-known/acme-challenge/. Chosen over
  # Caddy because the project's edge is ALREADY nginx (existing configs,
  # existing operational docs) -- a companion adds TLS without replacing
  # a working architecture. After a renewal actually replaces a
  # certificate, reload nginx to pick it up (DEPLOY.md documents a
  # weekly `nginx -s reload` cron line that makes this a non-event;
  # certificates are valid 90 days, so there is ample slack).
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot;
        sleep 12h & wait $${!};
      done;"

volumes:
  postgres_data:
  static_volume:
  media_volume:
  certbot_certs:
  certbot_www:
