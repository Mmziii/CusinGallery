# PRODUCTION edge configuration for cusin.ir / www.cusin.ir (Phase E).
#
# Mounted by docker-compose.prod.yml as /etc/nginx/conf.d (the main
# nginx.conf includes conf.d/*.conf). Replaces nginx/conf.d/cusin.conf,
# which stays as the development/HTTP-only variant.
#
# Routing (identical backend/frontend split as development, plus TLS):
#   :80   -> ACME challenge (certbot webroot) + 301 redirect to HTTPS
#   :443  -> /static/, /media/          served directly from the shared
#                                          volumes (never proxied)
#            /api/, /admin/             -> backend (Django/Gunicorn)
#            /payment/callback/         -> backend  (ZarinPal return URL --
#                                          exact prefix so the SPA's
#                                          /payment/result/ pages still go
#                                          to the frontend)
#            /healthz                   -> backend  (monitoring probe)
#            /robots.txt, /sitemap.xml  -> backend  (SEO, served by Django)
#            everything else            -> frontend (built React SPA)
#
# No redirect loops behind the proxy: every backend location forwards
# X-Forwarded-Proto, and Django trusts it (SECURE_PROXY_SSL_HEADER in
# config/settings/production.py). With HTTPS_ENABLED=True Django's own
# SECURE_SSL_REDIRECT therefore sees is_secure()=True for requests that
# arrived over TLS and does not redirect again; plain-HTTP requests are
# already 301'd here before Django ever sees them.
#
# HSTS: Django emits it (SECURE_HSTS_SECONDS when HTTPS_ENABLED=True) for
# the responses IT renders -- admin, API, SEO endpoints. It cannot cover
# the ones it never sees, though: the SPA shell, /static/ and /media/ are
# served by nginx/the frontend container. The edge therefore adds
# Strict-Transport-Security here too, in the TLS server block only (over
# plain http it is meaningless). Both send the same max-age, driven by
# SECURE_HSTS_SECONDS over there -- keep the two in step.

# Part S4 item 3: crawler detection (see the long comment on the same map in
# nginx/conf.d/cusin.conf). Kept byte-identical between the two stacks so
# previews behave the same in development and production.
map $http_user_agent $cusin_is_bot {
    default 0;
    "~*facebookexternalhit|facebookcatalog|facebot|whatsapp|telegrambot|telegram|twitterbot|slackbot|slack-imgproxy|linkedinbot|discordbot|pinterest|embedly|quora link preview|outbrain|vkshare|eitaa|balatarin|googlebot|google-inspectiontool|bingbot|msnbot|duckduckbot|baiduspider|yandex|sogou|exabot|ia_archiver|petalbot|applebot|semrushbot|ahrefsbot|dotbot|seznam|screaming frog|w3c_validator" 1;
}

upstream backend_upstream {
    server backend:8000;
}

upstream frontend_upstream {
    server frontend:80;
}

# --- HTTP: ACME challenge + hard redirect to HTTPS ----------------------------
server {
    listen 80;
    listen [::]:80;
    server_name cusin.ir www.cusin.ir;
    # nginx's version banner has no business on a public shop.
    server_tokens off;

    # Security headers, on every response of this server block.
    # NOTE: `add_header` is inherited by a nested block ONLY if that block
    # defines none of its own -- so these are repeated inside each location
    # below that sets its own Cache-Control. The `always` flag is required:
    # without it nginx drops them on 4xx/5xx responses, which is exactly
    # where clickjacking and MIME-sniffing attempts aim.
    # HSTS is deliberately NOT part of this list in the plain-HTTP configs:
    # it is meaningless over http and misleading in logs.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Let's Encrypt HTTP-01 challenge (certbot webroot mode). Must stay
    # reachable over plain HTTP -- that is how renewals prove ownership.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: the actual shop ----------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cusin.ir www.cusin.ir;
    # nginx's version banner has no business on a public shop.
    server_tokens off;

    # Security headers, on every response of this server block.
    # NOTE: `add_header` is inherited by a nested block ONLY if that block
    # defines none of its own -- so these are repeated inside each location
    # below that sets its own Cache-Control. The `always` flag is required:
    # without it nginx drops them on 4xx/5xx responses, which is exactly
    # where clickjacking and MIME-sniffing attempts aim.
    # HSTS is deliberately NOT part of this list in the plain-HTTP configs:
    # it is meaningless over http and misleading in logs.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    ssl_certificate     /etc/letsencrypt/live/cusin.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cusin.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10m;

    # Part R4 item 5: compress proxied responses at the edge. The
    # frontend container also gzips; nginx never double-compresses
    # (Content-Encoding upstream wins), so this mainly helps smaller
    # JSON/SVG payloads and any client the upstream did not serve.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml text/xml;

    # Collectstatic's 12-character content hashes are immutable. Only those
    # URLs may be cached for a long time; unhashed admin/static URLs must be
    # revalidated after every deploy so an old theme is never kept for 30 days.
    # The pattern is QUOTED on purpose: it contains `{12}`, and nginx
    # ends an unquoted token at the first `{`, so pcre2 would receive
    # `^/static/(.+\.[a-f0-9]` and fail at startup with
    # "pcre2_compile() failed: missing closing parenthesis".
    # apps/core/test_nginx_configs.py enforces this rule.
    location ~* "^/static/(.+\.[a-f0-9]{12}\.[^/]+)$" {
        alias /app/staticfiles/$1;
        expires 30d;
        # Repeated: nginx drops the server-level add_headers as soon as a
        # location defines one of its own (see the note in the server block).
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        add_header Cache-Control "public, immutable" always;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires off;
        # Repeated: nginx drops the server-level add_headers as soon as a
        # location defines one of its own (see the note in the server block).
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        # Repeated: nginx drops the server-level add_headers as soon as a
        # location defines one of its own (see the note in the server block).
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        add_header Cache-Control "public";
    }

    location /api/ {
        # Part R4 item 5: API answers are never cacheable (prices, stock
        # and session state change constantly).
        # Repeated: nginx drops the server-level add_headers as soon as a
        # location defines one of its own (see the note in the server block).
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        add_header Cache-Control "no-store" always;
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bulk product image import (a ZIP of the owner's photos) -- the only
    # route with a large body limit. `^~` beats the generic /admin/ prefix
    # so every other admin URL keeps the 10m server limit.
    location ^~ /admin/products/product/image-import/ {
        client_max_body_size 200m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Admin pages are frameable by THIS ORIGIN only (the "+" popups
        # render in an in-page iframe). Hide Django's header first so the
        # response never carries SAMEORIGIN and DENY at once.
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        add_header Cache-Control "private, no-store" always;
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        # Admin pages are frameable by THIS ORIGIN only: the RelatedObject
        # "+" popups open inside an in-page iframe. Everywhere else keeps
        # the server-level DENY. `proxy_hide_header` drops Django's value
        # so no response ever carries two different X-Frame-Options.
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        add_header Cache-Control "private, no-store" always;
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ZarinPal's return point (PAYMENT_CALLBACK_URL). Exact-prefix match
    # keeps the SPA's /payment/result/... routes on the frontend.
    location /payment/callback/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Monitoring probe (see apps/core/views.py). Unauthenticated by
    # design; access log off so uptime checkers don't drown the logs.
    location = /healthz {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # SEO files served by Django (dynamic product sitemap, robots policy).
    location = /robots.txt {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /sitemap.xml {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Crawler-visible meta (Part S4 item 3) ---------------------------
    # Same behaviour as nginx/conf.d/cusin.conf: a bot asking for a product
    # or a filtered category page is proxied to Django's /seo/ endpoints
    # for real Open Graph/Twitter/JSON-LD HTML; real visitors keep getting
    # the SPA. /api/, /admin/ and /payment/callback/ are untouched (their
    # own locations match first).
    location ~ ^/products/(?<cusin_product_slug>[^/]+)/$ {
        if ($cusin_is_bot) {
            rewrite ^ /seo/product/$cusin_product_slug/ break;
            proxy_pass http://backend_upstream;
        }
        # Audit 19 item 5: the catch-all decides between the shell (200) and
        # a real 404 for an unknown/inactive slug.
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Brand pages use the same real-status / crawler-preview boundary.
    location ~ ^/brands/(?<cusin_brand_slug>[^/]+)/$ {
        if ($cusin_is_bot) {
            rewrite ^ /seo/brand/$cusin_brand_slug/ break;
            proxy_pass http://backend_upstream;
        }
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /shop/ {
        if ($cusin_is_bot) {
            rewrite ^ /seo/shop/ break;
            proxy_pass http://backend_upstream;
        }
        # ?category=<slug> is validated by the same catch-all view; an
        # unknown category is a real 404 instead of an empty 200 listing.
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # --- Storefront build output (served by the frontend container) -------
    # Audit 19 item 5: page requests now go to Django (see `location /`), so
    # the bundle, the self-hosted fonts and the brand images need their own
    # locations -- the frontend container OWNS these files and is the only
    # place they exist.
    location ^~ /assets/ {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        # Repeated: nginx drops the server-level add_headers as soon as a
        # location defines one of its own (see the note in the server block).
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Everything under /assets/ is content-hashed by Vite: immutable.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /fonts/ {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        # Repeated: nginx drops the server-level add_headers as soon as a
        # location defines one of its own (see the note in the server block).
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Part R4 item 5: versioned by name, cache aggressively.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /brand/ {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        # Repeated: nginx drops the server-level add_headers as soon as a
        # location defines one of its own (see the note in the server block).
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /favicon.svg {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        # Repeated: nginx drops the server-level add_headers as soon as a
        # location defines one of its own (see the note in the server block).
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /favicon.ico {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        # Repeated: nginx drops the server-level add_headers as soon as a
        # location defines one of its own (see the note in the server block).
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /index.html {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        # Repeated: nginx drops the server-level add_headers as soon as a
        # location defines one of its own (see the note in the server block).
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # The shell itself must always revalidate.
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # --- Storefront pages: Django owns the decision ----------------------
    # Every page request goes to the catch-all view (apps/core/spa.py). It
    # checks the SPA's route table plus the real product/category slugs and
    # answers:
    #   * a real page  -> the built index.html, status 200;
    #   * anything else -> the same Persian document, status 404 with
    #     <meta name="robots" content="noindex"> and X-Robots-Tag: noindex.
    # Before this, `try_files ... /index.html` answered EVERY path with 200
    # (a soft 404 that search engines happily index).
    location / {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
