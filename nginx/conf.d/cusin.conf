# Public-facing reverse proxy for cusin.ir / www.cusin.ir.
#
# This is an HTTP-only foundation. HTTPS is NOT configured here yet --
# certificates don't exist until Certbot/Let's Encrypt is run against the
# real domain on the real server (this container has no way to obtain
# them). See the commented HTTPS block at the bottom for what to add once
# certificates exist under /etc/letsencrypt/live/cusin.ir/.
#
# Routing:
#   /                     -> frontend container (built React app)
#   /api/, /admin/         -> backend container (Django/Gunicorn)
#   /payment/callback/     -> backend container: the payment gateway's
#                             server-side callback endpoint (the documented
#                             PAYMENT_CALLBACK_URL default,
#                             https://cusin.ir/payment/callback/, is this
#                             root-level alias -- see apps/payments/
#                             urls_root.py). NOTE: everything else under
#                             /payment/ (e.g. /payment/result/) belongs to
#                             the React app and must keep hitting the
#                             frontend, hence the exact-prefix location.
#   /static/, /media/      -> served directly by nginx from shared volumes,
#                             never proxied through Gunicorn

# Part S4 item 3: crawler detection. Social previewers and search engines
# that do NOT execute JavaScript (WhatsApp, Telegram, Instagram, Eitaa,
# Twitter/X, Slack, LinkedIn, Discord, Pinterest, Googlebot, bingbot, ...)
# get server-rendered Open Graph/JSON-LD HTML from Django instead of the
# SPA shell; every real visitor is unaffected.
map $http_user_agent $cusin_is_bot {
    default 0;
    "~*facebookexternalhit|facebookcatalog|facebot|whatsapp|telegrambot|telegram|twitterbot|slackbot|slack-imgproxy|linkedinbot|discordbot|pinterest|embedly|quora link preview|outbrain|vkshare|eitaa|balatarin|googlebot|google-inspectiontool|bingbot|msnbot|duckduckbot|baiduspider|yandex|sogou|exabot|ia_archiver|petalbot|applebot|semrushbot|ahrefsbot|dotbot|seznam|screaming frog|w3c_validator" 1;
}

upstream backend_upstream {
    server backend:8000;
}

upstream frontend_upstream {
    server frontend:80;
}

server {
    listen 80;
    listen [::]:80;
    server_name cusin.ir www.cusin.ir;
    # nginx's version banner has no business on a public shop.
    server_tokens off;

    # Security headers, on every response of this server block.
    # NOTE: `add_header` is inherited by a nested block ONLY if that block
    # defines none of its own -- so these are repeated inside each location
    # below that sets its own Cache-Control. The `always` flag is required:
    # without it nginx drops them on 4xx/5xx responses, which is exactly
    # where clickjacking and MIME-sniffing attempts aim.
    # HSTS is deliberately NOT part of this list in the plain-HTTP configs:
    # it is meaningless over http and misleading in logs.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Reserved for the Certbot ACME HTTP-01 challenge once HTTPS is set up.
    # location /.well-known/acme-challenge/ {
    #     root /var/www/certbot;
    # }

    client_max_body_size 10m;

    # Collectstatic's 12-character content hashes are immutable. Only those
    # URLs may be cached for a long time; unhashed admin/static URLs must be
    # revalidated after every deploy so an old theme is never kept for 30 days.
    # The pattern is QUOTED on purpose: it contains `{12}`, and nginx
    # ends an unquoted token at the first `{`, so pcre2 would receive
    # `^/static/(.+\.[a-f0-9]` and fail at startup with
    # "pcre2_compile() failed: missing closing parenthesis".
    # apps/core/test_nginx_configs.py enforces this rule.
    location ~* "^/static/(.+\.[a-f0-9]{12}\.[^/]+)$" {
        alias /app/staticfiles/$1;
        expires 30d;
        # Repeated: nginx drops the server-level add_headers as soon as a
        # location defines one of its own (see the note in the server block).
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        add_header Cache-Control "public, immutable" always;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires off;
        # Repeated: nginx drops the server-level add_headers as soon as a
        # location defines one of its own (see the note in the server block).
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        # Repeated: nginx drops the server-level add_headers as soon as a
        # location defines one of its own (see the note in the server block).
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        add_header Cache-Control "public";
    }

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bulk product image import (a ZIP of the owner's photos). This is the
    # ONLY route that accepts a large request body: `^~` makes it win over
    # the generic /admin/ prefix below, and everything else under /admin/
    # keeps the 10m limit set for the server. Keep the two in sync with
    # nginx/prod.d/cusin.conf and docs/DEPLOY.md.
    location ^~ /admin/products/product/image-import/ {
        client_max_body_size 200m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Admin pages are frameable by THIS ORIGIN only (the "+" popups
        # render in an in-page iframe). Hide Django's header so the
        # response never carries SAMEORIGIN and DENY at once.
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        # Admin pages are frameable by THIS ORIGIN only: the RelatedObject
        # "+" popups open inside an in-page iframe. Everywhere else --
        # storefront, /api/ -- keeps the server-level DENY. The location
        # sets its own add_headers, so it must repeat the security
        # headers; proxy_hide_header drops Django's value first so no
        # response ever carries two different X-Frame-Options values.
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        add_header Cache-Control "private, no-store" always;
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Payment gateway callback (root-level alias served by Django -- see
    # the routing comment at the top). Must stay an exact prefix so the
    # SPA's /payment/result/ pages keep going to the frontend.
    location /payment/callback/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Monitoring probe (apps/core/views.py). Same routing as the prod
    # config so uptime checkers work identically in both stacks; access
    # log off so polling doesn't drown the logs.
    location = /healthz {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # SEO files are rendered by Django (dynamic product sitemap, robots
    # policy) -- without these two exact matches the SPA fallback below
    # would answer /robots.txt and /sitemap.xml with index.html.
    location = /robots.txt {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /sitemap.xml {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Crawler-visible meta (Part S4 item 3) ---------------------------
    # Bots never run the SPA's JavaScript, so its per-page Open Graph/Twitter
    # tags do not exist for them. For product and category URLs a bot is
    # proxied to Django's small /seo/... endpoints (real HTML, real meta,
    # JSON-LD); everybody else keeps getting the React app, unchanged.
    #
    # The `if` + `rewrite ... break` + URI-less `proxy_pass` shape is the
    # documented-safe use of `if` (nginx's "If is Evil"): requests that do
    # not match fall through to the location's own proxy_pass below.
    location ~ ^/products/(?<cusin_product_slug>[^/]+)/$ {
        if ($cusin_is_bot) {
            rewrite ^ /seo/product/$cusin_product_slug/ break;
            proxy_pass http://backend_upstream;
        }
        # Audit 19 item 5: the catch-all decides between the shell (200) and
        # a real 404 for an unknown/inactive slug.
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The shop's category filter is a query string (/shop/?category=<slug>),
    # so this is an exact match on the path; the query string survives the
    # rewrite and Django reads ?category= itself. A bot asking for /shop/
    # without a category gets a generic shop document, not a 404.
    # Brand pages use the same real-status / crawler-preview boundary.
    location ~ ^/brands/(?<cusin_brand_slug>[^/]+)/$ {
        if ($cusin_is_bot) {
            rewrite ^ /seo/brand/$cusin_brand_slug/ break;
            proxy_pass http://backend_upstream;
        }
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /shop/ {
        if ($cusin_is_bot) {
            rewrite ^ /seo/shop/ break;
            proxy_pass http://backend_upstream;
        }
        # ?category=<slug> is validated by the same catch-all view; an
        # unknown category is a real 404 instead of an empty 200 listing.
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # --- Storefront build output (served by the frontend container) -------
    # Audit 19 item 5: page requests now go to Django (see `location /`), so
    # the bundle, the self-hosted fonts and the brand images need their own
    # locations -- the frontend container OWNS these files and is the only
    # place they exist.
    location ^~ /assets/ {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        # Repeated: nginx drops the server-level add_headers as soon as a
        # location defines one of its own (see the note in the server block).
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Everything under /assets/ is content-hashed by Vite: immutable.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /fonts/ {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        # Repeated: nginx drops the server-level add_headers as soon as a
        # location defines one of its own (see the note in the server block).
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Part R4 item 5: versioned by name, cache aggressively.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /brand/ {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        # Repeated: nginx drops the server-level add_headers as soon as a
        # location defines one of its own (see the note in the server block).
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /favicon.svg {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        # Repeated: nginx drops the server-level add_headers as soon as a
        # location defines one of its own (see the note in the server block).
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /favicon.ico {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        # Repeated: nginx drops the server-level add_headers as soon as a
        # location defines one of its own (see the note in the server block).
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /index.html {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        # Repeated: nginx drops the server-level add_headers as soon as a
        # location defines one of its own (see the note in the server block).
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # The shell itself must always revalidate.
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # --- Storefront pages: Django owns the decision ----------------------
    # Every page request goes to the catch-all view (apps/core/spa.py). It
    # checks the SPA's route table plus the real product/category slugs and
    # answers:
    #   * a real page  -> the built index.html, status 200;
    #   * anything else -> the same Persian document, status 404 with
    #     <meta name="robots" content="noindex"> and X-Robots-Tag: noindex.
    # Before this, `try_files ... /index.html` answered EVERY path with 200
    # (a soft 404 that search engines happily index).
    location / {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- HTTPS (enable once certificates exist) ---------------------------------
# After running Certbot against cusin.ir / www.cusin.ir on the real server:
#   1. Uncomment the server block below.
#   2. Uncomment the HTTP->HTTPS redirect block below.
#   3. Set HTTPS_ENABLED=True in the backend's environment (root .env or
#      backend/.env) -- see config/settings/production.py. This is what
#      turns on SECURE_SSL_REDIRECT, secure-only cookies, and HSTS on the
#      Django side; without it Django keeps serving plain HTTP even if
#      nginx itself is terminating TLS.
#   4. Uncomment the "443:443" port mapping and the certbot_certs volume
#      mount in docker-compose.yml.
#
# server {
#     listen 443 ssl http2;
#     listen [::]:443 ssl http2;
#     server_name cusin.ir www.cusin.ir;
#
#     ssl_certificate     /etc/letsencrypt/live/cusin.ir/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/cusin.ir/privkey.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#
#     # ... same location blocks as the port-80 server above ...
# }
#
# server {
#     listen 80;
#     listen [::]:80;
#     server_name cusin.ir www.cusin.ir;
